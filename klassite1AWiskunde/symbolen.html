<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="symbolen" data-title="Symbolen">
    <div class="layout">
        <aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">W1</span><span><strong
                        data-site-name></strong><small data-site-subtitle></small></span></a>
            <nav data-navigation></nav>
        </aside>
        <main class="content">
            <div class="topbar"><span class="eyebrow">Naslagwerk</span><button class="menu-button"
                    data-menu-button>Menu</button></div>
            <h1>Symbolen</h1>
            <p class="lead">Dit overzicht groeit mee met de hoofdstukken die zichtbaar worden.</p>
            <section class="card">
                <table class="symbol-table">
                    <tr>
                        <th>Symbool</th>
                        <th>Betekenis</th>
                    </tr>
                    <tr>
                        <td>∈ / ∉</td>
                        <td>is een element van / is geen element van</td>
                    </tr>
                    <tr>
                        <td>⊂ / ⊄</td>
                        <td>is een deelverzameling van / is geen deelverzameling van</td>
                    </tr>
                    <tr>
                        <td>∩</td>
                        <td>doorsnede</td>
                    </tr>
                    <tr>
                        <td>∪</td>
                        <td>unie</td>
                    </tr>
                    <tr>
                        <td>∖</td>
                        <td>verschil</td>
                    </tr>
                </table>
            </section>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
